<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#b71c1c" flood-opacity="0.28"/>
    </filter>
  </defs>
  
  <!-- White background like the website -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Red header card matching the website style -->
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="1040" height="430" rx="14" fill="#e53935" stroke="#ff6f60" stroke-width="3"/>
    <!-- 3D bottom shadow effect -->
    <rect x="80" y="518" width="1040" height="12" rx="6" fill="#b71c1c"/>
  </g>
  
  <!-- Decorative white square (top-right) like the header::after -->
  <rect x="1010" y="120" width="70" height="70" rx="10" fill="rgba(255,255,255,0.12)"/>
  <rect x="1002" y="128" width="70" height="70" rx="10" fill="rgba(183,28,28,0.45)"/>
  
  <!-- Brand text -->
  <text x="120" y="260" fill="#ffffff" font-family="'Bungee', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="72" font-weight="700" letter-spacing="0.04em">
    CODINGMARVEL.COM
  </text>
  
  <!-- Subtitle text -->
  <text x="120" y="340" fill="rgba(255,255,255,0.86)" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="32" font-weight="400">
    New here? Welcome! Discover a great collection
  </text>
  <text x="120" y="385" fill="rgba(255,255,255,0.86)" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="32" font-weight="400">
    of web tools — pick any square below to jump in.
  </text>
  
  <!-- Small decorative squares at bottom representing the cards -->
  <rect x="120" y="440" width="60" height="60" rx="8" fill="rgba(255,255,255,0.2)"/>
  <rect x="195" y="440" width="60" height="60" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="440" width="60" height="60" rx="8" fill="rgba(255,255,255,0.1)"/>
</svg>
